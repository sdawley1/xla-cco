[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xla_cco"
version = "0.1.0"
description = "Pure-JAX collective-coordinate optimization for stealthy hyperuniform ground states"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Samuel J. Dawley" }]
dependencies = [
    "jax>=0.12",
    "equinox",
    "optax",
    "jaxtyping",
    "beartype",
    "numpy",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "scipy",
    "ruff",
    "mypy",
    "pre-commit",
    "mutmut",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xla_cco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes more than 30 s",
    "gpu: needs a GPU",
]

[tool.coverage.run]
source = ["xla_cco"]
omit = []

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["UP006", "UP035", "UP007", "UP045", "F722", "F821"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]
"src/**" = ["N803", "N806"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["optax.*"]
ignore_missing_imports = true
