name: CI

# Test tiers (tests/tiers.py): --priority=<tier> runs that tier and all higher
# ones (critical > high > medium > low). Which tiers run:
#   workflow_dispatch          the "priority" input
#   pull_request               a "ci:<tier>" label if present, else low (all)
#   push to main               low (all)
#   push to any other branch   repo variable CI_PRIORITY if set, else critical
# The coverage gate applies only when every tier runs.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      priority:
        description: "Lowest tier to run (cumulative); low runs every test"
        type: choice
        options: [critical, high, medium, low]
        default: low

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync environment
        run: uv sync --dev --locked
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Mypy
        run: uv run --no-sync mypy --strict src
      - name: Choose test tiers
        id: tiers
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.priority }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BRANCH_DEFAULT: ${{ vars.CI_PRIORITY }}
        run: |
          case "$EVENT" in
            workflow_dispatch) p="$INPUT" ;;
            pull_request)
              p=low
              for t in critical high medium low; do
                case " $LABELS " in *" ci:$t "*) p="$t"; break ;; esac
              done ;;
            *) if [ "$REF" = "refs/heads/main" ]; then p=low; else p="${BRANCH_DEFAULT:-critical}"; fi ;;
          esac
          case "$p" in critical|high|medium|low) ;; *) echo "unknown tier '$p'" >&2; exit 1 ;; esac
          cov=""
          if [ "$p" = low ]; then cov="--cov=xla_cco --cov-fail-under=90"; fi
          echo "priority=$p" >> "$GITHUB_OUTPUT"
          echo "cov=$cov" >> "$GITHUB_OUTPUT"
          echo "Test tiers: --priority=$p ($EVENT, $REF)" >> "$GITHUB_STEP_SUMMARY"
      - name: Pytest
        env:
          PRIORITY: ${{ steps.tiers.outputs.priority }}
          COV: ${{ steps.tiers.outputs.cov }}
        # $COV is unquoted on purpose: it is empty or two separate flags
        run: >
          uv run --no-sync pytest -m "not gpu" --priority "$PRIORITY"
          --hypothesis-profile=ci $COV
